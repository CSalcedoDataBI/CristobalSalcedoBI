name: Daily Telemetry Snapshot

on:
  schedule:
    # 01:30 UTC — traffic data for the previous day is available by then
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Snapshot date (YYYY-MM-DD, default: yesterday UTC)'
        required: false
        type: string

concurrency:
  group: telemetry-snapshot
  cancel-in-progress: false  # never cancel a snapshot mid-run; partial writes corrupt data

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # needed to commit telemetry data files

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot portfolio traffic
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TELEMETRY_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--date ${{ inputs.date }}"
          fi
          python telemetry/scripts/snapshot.py $ARGS

      - name: Commit telemetry data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telemetry/data/ telemetry/summary.json
          # Only commit if there are actual changes
          git diff --cached --quiet || \
            git commit -m "chore(telemetry): daily snapshot $(date -u +%Y-%m-%d) [skip ci]"
          git push
