name: Daily Telemetry Snapshot

on:
  schedule:
    # 01:30 UTC — traffic data for the previous day is available by then
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Snapshot date (YYYY-MM-DD, default: yesterday UTC)'
        required: false
        type: string

concurrency:
  group: telemetry-snapshot
  cancel-in-progress: false  # never cancel a snapshot mid-run; partial writes corrupt data

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # needed to commit telemetry data files

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot portfolio traffic
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TELEMETRY_TOKEN }}
          # Passed through env, never interpolated into the shell: a ${{ }} expression
          # inside run: is executed as code, so a crafted dispatch input would run
          # arbitrary commands on the runner.
          SNAPSHOT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$SNAPSHOT_DATE" ]; then
            python telemetry/scripts/snapshot.py --date "$SNAPSHOT_DATE"
          else
            python telemetry/scripts/snapshot.py
          fi

      - name: Commit telemetry data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # docs/, not telemetry/: Pages publishes docs/, and the dashboard fetches
          # these over HTTP. Written anywhere else they are unreachable from the page.
          git add docs/telemetry/
          # Only commit if there are actual changes
          git diff --cached --quiet || \
            git commit -m "chore(telemetry): daily snapshot $(date -u +%Y-%m-%d) [skip ci]"
          git push
