<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" role="img" aria-label="Cristobal Salcedo">
  <defs>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72EBC4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08110F"/>
      <stop offset="100%" stop-color="#17241F"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72EBC4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="200" rx="14"/></clipPath>
    <g id="isotipo">
      <circle cx="50" cy="50" r="46" fill="none" stroke="url(#mark)" stroke-width="1" stroke-opacity="0.15"/>
      <circle cx="50" cy="50" r="46" fill="none" stroke="url(#mark)" stroke-width="2.5" stroke-linecap="round"/>
      <g stroke="url(#mark)" stroke-width="1.2" fill="none" stroke-opacity="0.5">
        <path d="M 50,22 L 75,40"/><path d="M 75,40 L 65,70"/><path d="M 65,70 L 35,70"/>
        <path d="M 35,70 L 25,40"/><path d="M 25,40 L 50,22"/><path d="M 50,22 L 50,50"/>
        <path d="M 75,40 L 50,50"/><path d="M 65,70 L 50,50"/><path d="M 35,70 L 50,50"/>
        <path d="M 25,40 L 50,50"/>
      </g>
      <circle cx="50" cy="22" r="3.2" fill="url(#mark)"/>
      <circle cx="75" cy="40" r="3.2" fill="url(#mark)"/>
      <circle cx="65" cy="70" r="3.2" fill="url(#mark)"/>
      <circle cx="35" cy="70" r="3.2" fill="url(#mark)"/>
      <circle cx="25" cy="40" r="3.2" fill="url(#mark)"/>
      <circle cx="50" cy="50" r="4.5" fill="url(#mark)"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="200" fill="url(#bg)"/>
    <g opacity="0.09" transform="translate(940,-140) scale(4.4)"><use href="#isotipo"/></g>
    <rect x="0" y="0" width="1280" height="4" fill="url(#rule)"/>

    <g transform="translate(64,44) scale(1.12)"><use href="#isotipo"/></g>

    <text x="232" y="128" font-size="80" font-weight="700" letter-spacing="-1" fill="#E4F0EC"
          font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Cristobal Salcedo</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="199" rx="14" fill="none" stroke="#263B35"/>
</svg>
